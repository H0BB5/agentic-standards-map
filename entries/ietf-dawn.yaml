id: ietf-dawn
name: IETF DAWN, Discovery of Agents With Names (proposed WG)
org: IETF
kind: charter
tier: core
status: 'Charter 00-09 was on the IESG ballot: on 2026-10-06 one IESG member changed from Block (on 00-08) to No Objection and another voted Yes; on 2026-10-07 one member voted Yes with comments and three recorded No Objection; on 2026-10-08 two more recorded No Objection; the IESG telechat had been set for 2026-10-08. On 2026-10-09 the charter was revised to 00-10 and sent to external review: the datatracker history of that day shows the state changed from "Start Chartering/Rechartering (Internal Steering Group/IAB Review)" to "External Review (Message to Community, Selected by Secretariat)", the "Ready for external review" ballot closed, an "Approve" ballot created and the telechat date changed from 2026-10-08 to 2026-10-22; one IESG member recorded Yes on the new ballot on 2026-10-12. The datatracker pages read on 2026-10-13 show the WG as "Proposed" and charter-ietf-dawn-00-10 in that state, with "On agenda of 2026-10-22 IESG telechat". The Secretariat''s announcement "WG Review: Discovery of Agents With Names (dawn)", sent to ietf-announce on 2026-10-09, says "The IESG has not made any determination yet" and asks for comments to the IESG mailing list by 2026-10-19. No WG Action announcement for DAWN is among the ietf-announce messages up to 2026-10-12, the latest of the list on 2026-10-13; a decision on DAWN is not found.'
status_as_of: 2026-10-13
relevance: 'DAWN would standardise how a client discovers "public properties of AI resources", so it is the IETF venue where a seller''s agent surface would be found. The charter examples are commercial in form: "discover all agents in this shop" and "discover all agents of example.org, for all its customers/members". The WG "will also specify the minimum public discovery information (e.g., type, reachability information, communication protocol, services)."; commerce as a scope item: not found in charter 00-10, read 2026-10-13 (commerce, merchant, transaction, payment and purchase do not occur; "shop" occurs once, in the example "discover all agents in this shop"), nor in charter 00-08, 2026-10-03. On 2026-10-05 the INT Area Director wrote, on a request for a non-WG mailing list for DNS records under underscore labels that carry keys, key commitments or references to them, "While a mailing list will be created, I would like to push back on its name as it misses link to DNS"; the requester proposed the name dns-underscore-keys. An individual survey, draft-jimenez-dawn-discovery-landscape-00 (2026-07-03), compares discovery mechanisms from the IETF, AAIF, 3GPP and open-source projects and lists eight gaps, among them "Well-Known Namespace Pressure"; a text search of it finds no occurrence of AI Catalog, ARD, UCP or commerce (2026-10-06). draft-zhang-dawn-agent-discovery-framework-01 (2026-09-06) proposes a two-layer federated architecture. A second individual draft, draft-moussa-dawn-gap-analysis-01 (Moussa, Akhavain, 2026-06-12), is a gap analysis and applicability statement that maps existing discovery mechanisms to the DAWN problem statement and requirements; a text search of it finds no occurrence of AI Catalog, ARD, UCP or commerce (2026-10-06). draft-kay-dawn-use-cases-01 (2026-09-10) names Agentic Resource Discovery as a possible interface to a provider''s catalogue in a broadcast use case and adds: "ARD is an illustrative option; protocol choice remains open." The IETF Chair announced on 2026-10-02 that an INT Area Director resigned from the IESG as of 2026-10-01 and that the other co-AD for the INT area is the primary point of contact for the area; the datatracker lists that Area Director as responsible AD for DAWN (2026-10-03). On 2026-10-07 an IESG member entered a Yes with comments on 00-09 that asks the charter to say that the protocol specifications normatively define the minimum discovery information, that the WG is "expected to converge on one mechanism per deployment context", and that "discovering where a catalog is lives in DAWN, and what a catalog contains doesn''t"; the member also asks whether DAWN defines how agents are named, and that DNSSD, DNSOP and AgentProto be named in the coordination text. On the list thread "DAWN Coordination: Discovery Information and Trust Artifact Pointers" Girish Konda wrote on 2026-10-07 that a reference that does not resolve, one blocked by the discovering entity''s own retrieval policy, and one that resolves with the record absent are three causes: "All three end as no discovery result, and they have different owners and different retries." On 2026-10-12 a participant who states that they are a co-author of three individual drafts in this space wrote to the IESG on the DAWN list in reply to the WG Review thread "I support chartering DAWN as written in charter-ietf-dawn-00-10", and gave as a reason for keeping identity management of agents out of the first phase "Discovery has to work before anyone argues about who the discovered thing is".'
